name: py-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall Skills/ docs/
      - run: python -c "import pathlib, sys; [print(p) for p in pathlib.Path('Skills').glob('*.py')]"
